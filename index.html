  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

r-radius:12px;box-shadow:5px 5px 0 #1a1a17;overflow:hidden}\n.win__bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sun);color:#1a1a17;border-bottom:2.5px solid #1a1a17;font:600 12px/16px \"DM Mono\",ui-monospace,monospace}\n.win__dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #1a1a17;background:#fffdf8}\n.win__body{padding:16px}\n\n/* ---------- Buttons & tags ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px/1 \"Instrument Sans\",system-ui,sans-serif;padding:12px 16px;background:#fffdf8;color:#1a1a17;border:2.5px solid #1a1a17;border-radius:12px;box-shadow:3px 3px 0 #1a1a17;cursor:pointer;transition:transform .12s steps(3),box-shadow .12s steps(3)}\n.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #1a1a17}\n.btn:active{transform:translate(2px,2px);box-shadow:none}\n.btn--primary{background:var(--sun);color:#1a1a17}\n.btn--teal{background:var(--teal);color:#f6f1e7}\n.btn--pink{background:#ff7fa8;color:#1a1a17}\n.btn--ghost{background:transparent;box-shadow:none}\n.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}\n.tag{display:inline-block;font:600 12px/16px \"Instrument Sans\",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border:1.5px solid #1a1a17;border-radius:999px;background:#fffdf8;color:#1a1a17}\n.tag--sun{background:var(--sun);color:#1a1a17}\n.tag--sky{background:#6bb4dc;color:#1a1a17}\n.tag--pink{background:#ff7fa8;color:#1a1a17}\n.tag--leaf{background:#5cc07a;color:#1a1a17}\n\n/* ---------- Annotation text ---------- */\n.annot{font-family:\"Fraunces\",Georgia,serif;font-weight:700;color:var(--scribble)}\n.annot--hand{font-family:\"Caveat\",\"Comic Sans MS\",cursive;font-weight:700}\n\n.note,.note-lg,.hand,.hand-lg{color:var(--scribble)}\n\n/* ---------- Tones: swap the mark and annotation colour for a view ---------- */\n.tone-blue{--scribble:#2a64a8}\n.tone-green{--scribble:#3f6b2f}\n.tone-teal{--scribble:var(--teal)}\n.tone-ink{--scribble:#1a1a17}\n\n/* ---------- Shadows ---------- */\n.shadow-hard{box-shadow:5px 5px 0 #1a1a17}\n.shadow-stack{box-shadow:4px 4px 0 #1a1a17,8px 8px 0 #ffc933}\n.shadow-tab{box-shadow:0 6px 0 #1a1a17}\n\n/* ---------- Stickers (SVG shape + centred text) ---------- */\n.stk{position:relative;display:inline-block;filter:drop-shadow(3px 3px 0 #1a1a17);transform:rotate(-1.5deg)}\n.stk--r{transform:rotate(2.5deg)}\n.stk svg{display:block;overflow:visible}\n.stk__fill{stroke:#1a1a17;stroke-width:2.5;stroke-linejoin:round}\n.stk__text{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 20px/1 \"Bricolage Grotesque\",\"Arial Black\",system-ui,sans-serif;color:#1a1a17;padding:0 8px}\n.f-sun{fill:var(--sun)} .f-sky{fill:#6bb4dc} .f-pink{fill:#ff7fa8} .f-leaf{fill:#5cc07a} .f-orange{fill:#ff8a2b} .f-teal{fill:var(--teal)} .f-raised{fill:#fffdf8}\n\n/* ---------- Placards ---------- */\n.placard{position:relative;display:flex;flex-direction:column;gap:16px;background:#fffdf8;color:#1a1a17;border:2.5px solid #1a1a17;border-radius:22px;box-shadow:5px 5px 0 #1a1a17;padding:32px}\n.placard--sun{background:var(--sun);color:#1a1a17}\n.placard--sky{background:#6bb4dc;color:#1a1a17}\n.placard--pink{background:#ff7fa8;color:#1a1a17}\n.placard--leaf{background:#5cc07a;color:#1a1a17}\n.placard--orange{background:#ff8a2b;color:#1a1a17}\n.placard--teal{background:var(--teal);color:#f6f1e7}\n\n/* ---------- Grid paper (sketchbook ground) ---------- */\n.grid-paper{background-image:linear-gradient(#d8cbb2 1px,transparent 1px),linear-gradient(90deg,#d8cbb2 1px,transparent 1px);background-size:28px 28px}\n\n.tone-sun{--scribble:var(--sun)}\n\n/* ---------- Phone placards ---------- */\n.phone{position:relative;width:230px;min-height:440px;display:flex;flex-direction:column;gap:12px;padding:56px 16px 24px;background:#fffdf8;color:#1a1a17;border:calc(2.5px * 2) solid #1a1a17;border-radius:40px;box-shadow:5px 5px 0 #1a1a17}\n.phone::before{content:\"\";position:absolute;top:14px;left:50%;width:68px;height:18px;margin-left:-34px;border-radius:999px;background:#1a1a17}\n.phone::after{content:\"\";position:absolute;bottom:10px;left:50%;width:72px;height:4px;margin-left:-36px;border-radius:999px;background:currentColor;opacity:.5}\n.phone--sun{background:var(--sun);color:#1a1a17}\n.phone--sky{background:#6bb4dc;color:#1a1a17}\n.phone--pink{background:#ff7fa8;color:#1a1a17}\n.phone--leaf{background:#5cc07a;color:#1a1a17}\n.phone--teal{background:var(--teal);color:#f6f1e7}\n\n/* ---------- More placard shapes ---------- */\n.placard--ticket::before,.placard--ticket::after{content:\"\";position:absolute;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#f6f1e7;border:2.5px solid #1a1a17}\n.placard--ticket::before{left:-15px;clip-path:inset(0 0 0 50%)}\n.placard--ticket::after{right:-15px;clip-path:inset(0 50% 0 0)}\n.placard--tab{background:#fffdf8;margin-top:28px}\n.placard--tab::before{content:\"\";position:absolute;left:24px;top:calc(-28px - 2.5px);width:120px;height:calc(28px + 2.5px * 2);background:inherit;border:2.5px solid #1a1a17;border-bottom:0;border-radius:12px 12px 0 0}\n.placard--banner{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}\n\n/* ---------- Spotlight: one thing dominates ---------- */\n.spot{position:relative;display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center;padding:48px 32px;border:2.5px solid #1a1a17;border-radius:22px;box-shadow:5px 5px 0 #1a1a17;overflow:hidden}\n.spot--teal{background:var(--teal);color:var(--sun)}\n.spot--pink{background:#ff7fa8;color:#1a1a17}\n.spot--sun{background:var(--sun);color:#1a1a17}\n.spot--sky{background:#6bb4dc;color:#1a1a17}\n.spot__headline{margin:0;font-family:\"Bricolage Grotesque\",\"Arial Black\",system-ui,sans-serif;font-weight:800;letter-spacing:-.025em;line-height:.9}\n\n/* ---------- Characters ---------- */\n.char{display:block;max-width:100%;height:auto}\n\n/* ---------- Slides: 16:9 canvas designed at 960x540 ---------- */\n.slide{position:relative;width:960px;height:540px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:64px;overflow:hidden;background:#f6f1e7;color:#1a1a17;border:calc(2.5px * 2) solid #1a1a17;border-radius:22px}\n.slide--sun{background:var(--sun);color:#1a1a17}\n.slide--sky{background:#6bb4dc;color:#1a1a17}\n.slide--pink{background:#ff7fa8;color:#1a1a17}\n.slide--leaf{background:#5cc07a;color:#1a1a17}\n.slide--orange{background:#ff8a2b;color:#1a1a17}\n.slide--teal{background:var(--teal);color:#f6f1e7}\n.slide__title{margin:0;font-family:\"Bricolage Grotesque\",\"Arial Black\",system-ui,sans-serif;font-weight:800;letter-spacing:-.025em;line-height:.95}\n.slide__serif{margin:0;font-family:\"Fraunces\",Georgia,serif;font-weight:600;letter-spacing:-.015em;line-height:1.02}\n.slide .btn{font-size:26px;padding:16px 24px}\n.slide-sc{position:relative;width:460px;height:259px;flex:none}\n.slide-sc>.slide{position:absolute;left:0;top:0;transform:scale(.4792);transform-origin:0 0}\n<\u002Fstyle>\n<style>/* Intellectual & Fun tokens as CSS variables, plus landing-page parts. */\n:root{\n  --surface:#f6f1e7;--surface-raised:#fffdf8;--surface-sunk:#ebe2d0;\n  --ink:#1a1a17;--ink-muted:#5b5548;--line-soft:#d8cbb2;--outline:#1a1a17;\n  --sun:#ffc933;--sky:#6bb4dc;--pink:#ff7fa8;--leaf:#5cc07a;--orange:#ff8a2b;--teal:#1d4a49;\n  --on-bright:#1a1a17;--on-teal:#f6f1e7;\n  --scribble:#a8452f;--scribble-blue:#2a64a8;--scribble-green:#3f6b2f;\n  --marker:#ffd84d;--focus:#1d4a49;--shade:#1a1a17;\n  --font-display:\"Bricolage Grotesque\",\"Arial Black\",system-ui,sans-serif;\n  --font-serif:\"Fraunces\",Georgia,serif;\n  --font-sans:\"Instrument Sans\",system-ui,sans-serif;\n  --font-hand:\"Caveat\",\"Comic Sans MS\",cursive;\n  --font-mono:\"DM Mono\",ui-monospace,monospace;\n  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:72px;\n  --radius-sm:6px;--radius-md:12px;--radius-lg:22px;--radius-pill:999px;\n  --shadow-hard-sm:3px 3px 0 #1a1a17;--shadow-hard:5px 5px 0 #1a1a17;--shadow-hard-lg:8px 8px 0 #1a1a17;\n  --shadow-stack:4px 4px 0 #1a1a17,8px 8px 0 #ffc933;--shadow-tab:0 6px 0 #1a1a17;\n  --border-thin:1.5px;--border-thick:2.5px;\n  --tilt-sm:-1.5deg;--tilt-md:2.5deg;\n}\nbody{margin:0;padding:0;background:#f6f1e7;color:#1a1a17;font-family:\"Instrument Sans\",system-ui,sans-serif}\n\n.lp{background:#f6f1e7;color:#1a1a17;font-family:\"Instrument Sans\",system-ui,sans-serif;min-height:100vh}\n.lp-wrap{max-width:1200px;margin:0 auto;padding:0 24px;box-sizing:border-box}\n.lp-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0}\n.lp-brand{font:800 28px/1 \"Bricolage Grotesque\",\"Arial Black\",system-ui,sans-serif;letter-spacing:-.01em;color:#1a1a17;text-decoration:none}\n.lp-navlinks{display:flex;gap:24px;align-items:center;flex-wrap:wrap}\n.lp-navlinks a{color:#1a1a17;font-weight:600;text-decoration:none}\n.lp-navlinks a:hover{color:var(--teal)}\n\n.lp-label{font:600 12px/16px \"Instrument Sans\",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5b5548;margin:0}\n.lp-section{padding:48px 0 0}\n.lp-h2{font:600 30px/36px \"Fraunces\",Georgia,serif;margin:8px 0 24px}\n\n/* Bucket buttons: natural widths, wrapping, uneven on purpose */\n.buckets{display:flex;flex-wrap:wrap;gap:16px}\n.bucket{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:12px 24px;font:700 18px/1.2 \"Instrument Sans\",system-ui,sans-serif;color:#1a1a17;background:#fffdf8;border:2.5px solid #1a1a17;border-radius:12px;box-shadow:3px 3px 0 #1a1a17;cursor:pointer;text-align:left;transition:transform .12s steps(3),box-shadow .12s steps(3)}\n.bucket:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #1a1a17}\n.bucket:active{transform:translate(2px,2px);box-shadow:none}\n.bucket--big{font-size:22px;min-height:68px;padding:16px 32px}\n.bucket--on{background:var(--sun);color:#1a1a17}\n.bucket--line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bucket--wrap{white-space:normal}\n.count{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border:1.5px solid #1a1a17;border-radius:999px;font:500 13px/1 \"DM Mono\",ui-monospace,monospace;background:#f6f1e7}\n.bucket--on .count{background:#fffdf8}\n\n/* Search window */\n.search{display:flex;gap:12px;flex-wrap:wrap}\n.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n.search input{flex:1 1 320px;min-width:0;min-height:56px;padding:0 16px;font:400 18px/1 \"Instrument Sans\",system-ui,sans-serif;color:#1a1a17;background:#f6f1e7;border:2.5px solid #1a1a17;border-radius:12px}\n.search input::placeholder{color:#5b5548}\n.search .btn{min-height:56px;font-size:18px;padding:0 32px}\n\n/* Ready questions */\n.chips{display:flex;flex-wrap:wrap;gap:12px 16px}\n.chip{display:inline-flex;align-items:center;min-height:48px;padding:8px 24px;font:600 16px/1.3 \"Instrument Sans\",system-ui,sans-serif;color:#1a1a17;background:#fffdf8;border:2.5px solid #1a1a17;border-radius:999px;cursor:pointer;text-align:left}\n.chip:hover{background:#ebe2d0}\n\n.margin-note{font:700 20px/24px \"Fraunces\",Georgia,serif;color:var(--scribble);display:inline-flex;align-items:center;gap:8px}\n.margin-hand{font:700 28px/28px \"Caveat\",\"Comic Sans MS\",cursive;color:var(--scribble);display:inline-flex;align-items:center;gap:8px}\n\n/* Accordion */\n.qrow{border-top:1.5px solid #d8cbb2}\n.qrow:first-child{border-top:0}\n.qbtn{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:24px 0;background:none;border:0;cursor:pointer;text-align:left;color:#1a1a17;font-family:\"Instrument Sans\",system-ui,sans-serif}\n.qtitle{display:block;font:600 24px/30px \"Fraunces\",Georgia,serif}\n.qfull{display:block;margin-top:8px;font:400 15px/22px \"Instrument Sans\",system-ui,sans-serif;color:#5b5548;max-width:760px}\n.qtoggle{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2.5px solid #1a1a17;border-radius:12px;font:600 15px/1 \"Instrument Sans\",system-ui,sans-serif;background:#fffdf8;box-shadow:3px 3px 0 #1a1a17;white-space:nowrap}\n.qtoggle--open{background:var(--sun)}\n.answer{margin:0 0 32px;padding:24px 32px;background:#f6f1e7;border:2.5px solid #1a1a17;border-radius:12px}\n.answer ol{margin:16px 0 0;padding-left:24px;display:flex;flex-direction:column;gap:12px;font:400 17px/26px \"Instrument Sans\",system-ui,sans-serif}\n.answer b{font-weight:700}\n.principle{margin:24px 0 0;padding-top:16px;border-top:1.5px solid #d8cbb2;font:500 italic 22px/30px \"Fraunces\",Georgia,serif;color:var(--teal)}\n\n/* Bucket panel */\n.bk-challenges{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}\n.bk-challenges li{position:relative;padding-left:28px;font:400 18px/26px \"Instrument Sans\",system-ui,sans-serif}\n.bk-challenges li::before{content:\"\";position:absolute;left:0;top:9px;width:16px;height:9px;border-left:3px solid var(--scribble);border-bottom:3px solid var(--scribble);transform:rotate(-45deg)}\n.qnum{flex:none;font:500 14px/1 \"DM Mono\",ui-monospace,monospace;color:#5b5548;min-width:28px}\n.ans{display:flex;flex-direction:column;gap:12px;margin-top:16px}\n.ans p{margin:0;font:400 17px/27px \"Instrument Sans\",system-ui,sans-serif;color:#1a1a17}\n.ans .a-h{font:600 20px/28px \"Fraunces\",Georgia,serif;margin-top:12px}\n.ans .a-li{position:relative;padding-left:24px}\n.ans .a-li::before{content:\"\";position:absolute;left:4px;top:12px;width:8px;height:8px;border-radius:50%;background:#1a1a17}\n.ans .principle{margin:8px 0 8px;padding:12px 0 0;font:500 italic 19px/28px \"Fraunces\",Georgia,serif}\n.ans .principle b{font-style:normal}\n\n/* Tablet: shrink the big type a step */\n@media (max-width:1024px){\n  .hero-h1{font-size:54px !important;line-h
