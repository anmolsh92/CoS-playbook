\" data-canvas-width=\"1568\" data-canvas-height=\"2695\" data-document-role=\"page\" data-label=\"CoS Playbook · landing (working prototype)\">\n<div class=\"lp-wrap\">\n  <nav class=\"lp-nav\" aria-label=\"Main\" style=\"color: #2E2EF8\">\n    <a class=\"lp-brand\" href=\"#\" style=\"font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -0.96px; font-style: normal; font-family: &quot;Fraunces&quot;, Georgia, serif\">The CoS Playbook<\u002Fa>\n    \n  <\u002Fnav>\n\n  <section class=\"hero-grid hero-sec\" style=\"display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 56px 0 24px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n      <p class=\"lp-label\">For the Chief of Staff to a Group CEO<\u002Fp>\n      <h1 class=\"hero-h1\" style=\"margin: 0; font: 600 68px/74px &quot;Fraunces&quot;,Georgia,serif; letter-spacing: -0.02em; color: #1a1a17;\">Challenges and roadblocks, <span class=\"mk mk-circle\">already<\u002Fspan> thought through.<\u002Fh1>\n      <p style=\"margin: 0; font: 400 20px/30px &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #5b5548; max-width: 560px;\">Describe the situation. I'll show you how a seasoned Chief of Staff would handle it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"hero-char\" style=\"display: flex; justify-content: center; position: relative;\">\n      <div class=\"card card--sun\" style=\"width: 340px; height: 260px; border-radius: 22px; padding: 0; display: flex; align-items: flex-end; justify-content: center; overflow: visible;\">\n        <img class=\"char\" src=\"e94cb7db-d845-4767-b916-08d4df7d6c50\" width=\"320\" alt=\"Calm person beside a fully ticked calendar and a cup of tea\" style=\"margin-bottom: -18px;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"browse\" class=\"lp-section\">\n    <p class=\"lp-label\">Browse by situation<\u002Fp>\n    <h2 class=\"lp-h2\">Different scenario buckets<\u002Fh2>\n    <sc-if value=\"{{noBucket}}\" hint-placeholder-val=\"{{true}}\">\n    <div class=\"buckets buckets--grid\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px;\">\n      <sc-for list=\"{{buckets}}\" as=\"b\" hint-placeholder-count=\"6\">\n        <button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\" aria-pressed=\"{{b.pressed}}\" style=\"background-color: #F8DFAD; color: var(--teal); font-size: {{b.fs}}px; width: 100%; min-height: 84px; padding: 16px 24px\">{{b.name}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasBucket}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"bk-backrow\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;\">\n        <button class=\"backlink\" type=\"button\" sc-camel-on-click=\"{{closeBucket}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a17\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M11 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>All six buckets<\u002Fbutton>\n        <p class=\"lp-label\">{{bucketMeta}}<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bk-selected\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 92px; padding: 18px 28px; background: var(--teal); color: #f6f1e7; border: 2.5px solid #1a1a17; border-radius: 14px; box-shadow: 4px 4px 0 #1a1a17,8px 8px 0 #ffc933;\">\n        <h2 class=\"bk-selname\" style=\"margin: 0; font: 700 26px/1.2 &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #f6f1e7;\">{{bucketName}}<\u002Fh2>\n        <span class=\"bk-seltag\" style=\"flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--sun); color: #1a1a17; border: 1.5px solid #1a1a17; border-radius: 999px; font: 600 12px/16px &quot;Instrument Sans&quot;,system-ui,sans-serif; letter-spacing: .08em; text-transform: uppercase;\"><i class=\"mk-tick\" style=\"--mk: #1a1a17;\"><\u002Fi>Selected<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card bk-card\" style=\"margin-top: 24px; padding: 36px 48px 24px; box-shadow: 8px 8px 0 #1a1a17;\">\n        <p class=\"bk-tag\" style=\"margin: 0; font: 500 italic 22px/30px &quot;Fraunces&quot;,Georgia,serif; color: var(--teal);\">{{bk.tagline}}<\u002Fp>\n\n        <div class=\"bk-intro\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; margin-top: 32px;\">\n          <div>\n            <p class=\"lp-label\">What this bucket is about<\u002Fp>\n            <p style=\"margin: 12px 0 0; font: 400 18px/28px &quot;Instrument Sans&quot;,system-ui,sans-serif;\">{{bk.about}}<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p class=\"lp-label\">Common challenges<\u002Fp>\n            <ul class=\"bk-challenges\">\n              <sc-for list=\"{{bk.challenges}}\" as=\"ch\" hint-placeholder-count=\"3\">\n                <li>{{ch.text}}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <blockquote class=\"bk-coreblock\" style=\"margin: 32px 0 0; padding: 0;\">\n          <p class=\"bk-core\" style=\"margin: 0; font: 700 28px/38px &quot;Fraunces&quot;,Georgia,serif; color: #1a1a17;\">“{{bk.core}}”<\u002Fp>\n        <\u002Fblockquote>\n\n        <p class=\"lp-label\" style=\"margin: 40px 0 0;\">{{scenarioLabel}}<\u002Fp>\n        <div>\n          <sc-for list=\"{{qs}}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div class=\"qrow\" id=\"{{q.rowId}}\" style=\"scroll-margin-top: 24px;\">\n              <button class=\"qbtn\" type=\"button\" sc-camel-on-click=\"{{q.toggle}}\" aria-expanded=\"{{q.expanded}}\">\n                <span class=\"q-head\" style=\"display: flex; gap: 16px; align-items: baseline;\">\n                  <span class=\"qnum\">{{q.num}}<\u002Fspan>\n                  <span class=\"qtitle q-title\" style=\"font-size: 22px; line-height: 30px;\">{{q.title}}<\u002Fspan>\n                <\u002Fspan>\n                <sc-if value=\"{{q.open}}\" hint-placeholder-val=\"{{false}}\"><span class=\"qtoggle qtoggle--open\">Collapse<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{q.closed}}\" hint-placeholder-val=\"{{true}}\"><span class=\"qtoggle\">Expand<\u002Fspan><\u002Fsc-if>\n              <\u002Fbutton>\n              <sc-if value=\"{{q.open}}\" hint-placeholder-val=\"{{false}}\">\n                <div class=\"answer\">\n                  <p class=\"lp-label\">Answer: major pointers<\u002Fp>\n                  <div class=\"ans\">\n                    <sc-for list=\"{{q.blocks}}\" as=\"k\" hint-placeholder-count=\"4\">\n                      <sc-if value=\"{{k.isP}}\" hint-placeholder-val=\"{{true}}\"><p class=\"a-p\">{{k.text}}<\u002Fp><\u002Fsc-if>\n                      <sc-if value=\"{{k.isH}}\" hint-placeholder-val=\"{{false}}\"><p class=\"a-h\">{{k.text}}<\u002Fp><\u002Fsc-if>\n                      <sc-if value=\"{{k.isPt}}\" hint-placeholder-val=\"{{false}}\"><p class=\"a-pt\"><b>{{k.lead}}<\u002Fb> {{k.text}}<\u002Fp><\u002Fsc-if>\n                      <sc-if value=\"{{k.isLi}}\" hint-placeholder-val=\"{{false}}\"><p class=\"a-li\"><b>{{k.lead}}<\u002Fb> {{k.text}}<\u002Fp><\u002Fsc-if>\n                      <sc-if value=\"{{k.isPr}}\" hint-placeholder-val=\"{{false}}\"><p class=\"principle\"><b>{{k.lead}}<\u002Fb> {{k.text}}<\u002Fp><\u002Fsc-if>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: center; padding: 24px 0 8px;\">\n          <button class=\"backlink\" type=\"button\" sc-camel-on-click=\"{{closeBucket}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a17\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M11 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>Back to all buckets<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"ask\" class=\"lp-section\">\n    <h2 class=\"ask-h2\" style=\"margin: 0 0 24px; font: 600 40px/46px &quot;Fraunces&quot;,Georgia,serif; color: #1a1a17;\">What are you facing?<\u002Fh2>\n\n    <div class=\"composer\" style=\"background: #fffdf8; border: 2.5px solid #1a1a17; border-radius: 22px; box-shadow: 8px 8px 0 #1a1a17; overflow: hidden;\">\n      <form class=\"composer-in\" role=\"search\" sc-camel-on-submit=\"{{onSearch}}\" style=\"display: flex; gap: 16px; align-items: flex-start; padding: 28px 32px 8px; margin: 0;\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a17\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px;\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n        <div style=\"flex: 1; min-width: 0;\">\n          <label for=\"qa\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);\">Type a scenario you want to know about<\u002Flabel>\n          <textarea id=\"qa\" rows=\"3\" placeholder=\"Type a scenario you want to know about...\" value=\"{{query}}\" sc-camel-on-change=\"{{onQuery}}\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fform>\n\n      <sc-if value=\"{{showResults}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"composer-res\" style=\"margin: 8px 32px 0; padding: 12px 20px; background: #f6f1e7; border: 1.5px solid #d8cbb2; border-radius: 14px;\">\n          <p class=\"lp-label\" style=\"margin: 4px 0;\">{{resultsLabel}}<\u002Fp>\n          <sc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button class=\"result\" type=\"button\" sc-camel-on-click=\"{{r.go}}\">\n              <span class=\"tag tag--sun\">{{r.bucket}}<\u002Fspan>\n              <span class=\"qtitle r-title\" style=\"font-size: 20px; line-height: 26px;\">{{r.title}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"composer-chips\" style=\"padding: 16px 32px 28px; display: flex; flex-direction: column; gap: 14px;\">\n        <p class=\"lp-label\">Or tap a ready question<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px 12px;\">\n          <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button class=\"qchip\" type=\"button\" sc-camel-on-click=\"{{c.go}}\">{{c.label}}<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1a1a17\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 17L17 7M9 7h8v8\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"principles\" class=\"pr-sec\" style=\"padding-top: 104px;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 40px;\">\n      <div>\n        <p class=\"lp-label\" style=\"font-size: 36px; line-height: 0.94; font-weight: 700; letter-spacing: 0px; font-style: normal; font-family: &quot;Caveat&quot;, &quot;Comic Sans MS&quot;, cursive\">Principles followed<\u002Fp>\n        <h2 class=\"pr-h2\" style=\"margin: 8px 0 0; font: 600 44px/48px &quot;Fraunces&quot;,Georgia,serif; font-size: 44px; line-height: 1.09; font-weight: 600; letter-spacing: 0px; font-style: normal; font-family: &quot;Fraunces&quot;, Georgia, serif; width: 775px; height: 39px\">How every answer is thought through<\u002Fh2>\n      <\u002Fdiv>\n      \n    <\u002Fdiv>\n    <div class=\"principles\" style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: start;\">\n      <article class=\"placard\" style=\"grid-column: span 5; padding: 32px; background-color: #E3E0D9\">\n        <h3 style=\"margin: 0; font: 600 28px/34px &quot;Fraunces&quot;,Georgia,serif;\">Separate judgment differences from communication gaps<\u002Fh3>\n        <p style=\"margin: 0; font: 400 17px/26px &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #5b5548;\">Through gradual, nuanced conversations, uncover the constraints and dependencies blocking progress. Then ask whether a disagreement is a real difference in judgment, or simply a discussion that hasn't happened yet.<\u002Fp>\n      <\u002Farticle><article class=\"placard placard--sun\" style=\"grid-column: span 7; box-shadow: 4px 4px 0 #1a1a17,8px 8px 0 #ffc933; padding: 40px;\">\n        <h3 style=\"margin: 0; font: 600 34px/40px &quot;Fraunces&quot;,Georgia,serif; color: #1a1a17;\">Build confidence through every interaction<\u002Fh3>\n        <p style=\"margin: 0; font: 400 18px/28px &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #1a1a17; max-width: 520px;\">Treat every interaction as an opportunity to build trust and strengthen relationships for future engagement.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"placard\" style=\"grid-column: span 5; margin-top: 56px; padding: 32px; background-color: #FFFC60\">\n        <h3 style=\"margin: 0; font: 600 28px/34px &quot;Fraunces&quot;,Georgia,serif;\">Diagnose before acting, and classify the miss<\u002Fh3>\n        <p style=\"margin: 0; font: 400 17px/26px &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #5b5548;\">Find the root cause before choosing a course of action. When a project reported as healthy suddenly fails, was it an unforeseen event, incorrect data, or the wrong intermediate metrics? And was the miss genuinely hard to anticipate, or an avoidable oversight?<\u002Fp>\n      <\u002Farticle>\n      \n      <article class=\"placard placard--teal\" style=\"grid-column: span 7; margin-top: -24px; padding: 40px;\">\n        <h3 style=\"margin: 0; font: 600 34px/40px &quot;Fraunces&quot;,Georgia,serif; color: #f6f1e7;\">Represent leadership with credibility, and keep the room productive<\u002Fh3>\n        <p style=\"margin: 0; font: 400 18px/28px &quot;Instrument Sans&quot;,system-ui,sans-serif; color: #f6f1e7; max-width: 560px;\">Protect the Chairperson's credibility through preparation and accurate communication, without deferring every question. Excess caution makes meetings in their absence lose weight, and wastes senior leaders' time.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2360}}\">\nfunction mk(t, lead, text) { return { isP: t === 'p', isH: t === 'h', isPt: t === 'pt', isLi: t === 'li', isPr: t === 'pr', lead: lead || '', text: text || '' }; }\nvar p = function (t) { return mk('p', '', t); };\nvar h = function (t) { return mk('h', '', t); };\nvar pt = function (l, t) { return mk('pt', l, t); };\nvar li = function (l, t) { return mk('li', l, t); };\nvar pr = function (l, t) { return mk('pr', l, t); };\n\nvar DATA = [\n  { name: 'Stakeholder Management and Influence Without Authority',\n    tagline: 'Working with senior leaders, building trust and navigating egos',\n    about: 'This covers how to build relationships with business unit CEOs who are more senior than you, secure responses without damaging relationships, and resolve disagreements.',\n    challenges: ['Business unit CEOs who outrank you and do not report to you', 'Follow-ups that go unanswered', 'Support that is read as interference or micromanagement'],\n    core: 'How do you get things done through people who do not report to you?',\n    qs: [\n    { title: 'You are significantly more junior than a business unit CEO. How would you build credibility and ensure that they take your requests seriously without feeling that you are overstepping your authority?', blocks: [\n      pt('1. Establish a clear mandate from the Chairperson:', 'I would need the Chairperson\\'s explicit request to set the context for my role and establish how I can be a valuable addition to the Chairperson\\'s team by streamlining collaboration and engagement with the leadership of the business units.'),\n      pt('2. Get up to speed quickly so as to make the interactions with the leadership pointed:', 'I would develop an understanding of the different business units, ongoing projects, and existing blockers. This would ensure that, from the early stages, my interactions with business unit leadership are focused and relevant, without consuming too much of their time in getting me acclimatized to the business.'),\n      pt('3. Position the role as outcome-oriented, not procedural:', 'Through my communication and conduct, I would demonstrate that I have skin in the game and that my performance would be judged by how well I contribute to the performance of individual business units. This would signal a shared business interest rather than positioning myself as someone primarily responsible for procedural coordination, disconnected from business unit performance.'),\n      pt('4. Establish credibility through the quality of early interactions:', 'The quality of my questions and the depth of interaction I bring to my initial conversations with business unit leaders will shape my reputation and establish credibility for the role. My understanding of the business and the relevance of my inputs should demonstrate the value I bring.'),\n      pt('5. Avoid demonstrating procedural effort at the cost of accountability:', 'I should avoid actions that merely showcase that I have followed a process. For example, while submitting a brief on a major issue, I should avoid shifting the onus onto other leaders through phrases such as “As mentioned by them” or “As discussed.” Instead, I should position myself as someone willing to take accountability for actions and facilitate the resolution of the issue.')\n    ]},\n    { title: 'You have followed up with a business unit CEO multiple times for an important update, but they are not responding. How would you get the information you need without damaging the relationship?', blocks: [\n      p('1. The first step would be to diagnose why this situation has arisen. I see three possible scenarios:'),\n      li('', 'The business unit CEO is occupied with day-to-day operational activities.'),\n      li('', 'The business unit CEO has not given the issue sufficient attention and does not consider it important enough.'),\n      li('', 'The business unit CEO does not value my role or wants to avoid a conversation on this particular issue.'),\n      p('My response would depend on which of these scenarios applies.'),\n      li('If the business unit CEO is occupied with operational activities:', 'Follow up while highlighting the urgency of the issue; keep communication crisp and convey a sense of urgency; and simplify the clutter to make it easier for the business unit CEO to respond.'),\n      li('If the business unit CEO does not consider the issue important enough:', 'Use more detailed, drill-down communication, breaking the issue into subpoints; document the details for future reference; and emphasize the gravity of the issue. I favour detailed written communication because it helps with sensitization.'),\n      li('If the business unit CEO is resistant to engaging with me:', 'Recognize that this is the most challenging scenario. Try to initiate a conversation and build confidence that the discussion is not intended as an escalation. Establish myself as a valuable stakeholder who can help the business unit CEO, applying the rapport-building principles discussed in Question 1. If these steps do not work, have a more direct conversation, explaining that the misalignment is affecting my work and will not serve the Chairperson well.')\n    ]},\n    { title: 'You disagree with a business unit CEO\\'s approach to an initiative that the Chairperson considers important. How would you communicate your disagreement and influence the business unit CEO to reconsider?', blocks: [\n      p('My experience so far in such cases is that the issue has usually not been broken down, discussed, or thought through adequately. I would drill down into the issue in three parts:'),\n      li('', 'Break the broader disagreement into multiple subparts, then approach each subpart individually and resolve the areas where there is no disagreement.'),\n      li('', 'For the areas where disagreement remains, examine whether either party or I myself has a bias on the issue, and discuss that explicitly.'),\n      li('', 'Determine whether the remaining disagreement is genuinely a major judgment call difference.'),\n      p('My objective would be to bring out the nuances of the issue and ensure that all minor aspects are thoroughly discussed or brainstormed. For the aspects where a difference remains because of a judgment call, I would document the underlying hypotheses so that they become a reference point for evaluating the decision in the future.')\n    ]},\n    { title: 'A business unit CEO feels that the Chairperson\\'s office is interfering too much in their business and that your follow-ups amount to micromanagement. How would you address the situation?', blocks: [\n      p('I would take the following actions to avoid or overcome this situation:'),\n      pt('1. Build credibility through detailed preparation:', 'Whenever I attend meetings, I should prepare in detail on current problems, the context, and the business unit. This will show that I respect their time, avoid beating around the bush, and do not consume too much time trying to understand the issue.'),\n      pt('2. Position the role as outcome-oriented, with skin in the game:', 'My role should come across as focused on outcomes rather than procedural alignment, so that the business unit\\'s performance is linked to my overall performance. The quality of my questions, the insights I bring, and the new perspectives I offer for consideration should demonstrate the value I add.'),\n      pt('3. Assure them that my role is to provide more help:', 'Through a range of measures, I should assure them that my role is to help them. These conversations will help me better understand their future requirements and prepare me to proactively support them, rather than waiting for a blocker or crisis to arise.')\n    ]},\n    { title: 'You join a new organization where the business unit CEOs have worked with the Chairperson for many years, while you are an outsider. How would you establish yourself in the first 90 days?', blocks: [\n      pt('1. Understand the source of resistance and credibility concerns:', 'The resistance could arise from questions about my credibility: whether I am adding real value to the conversation or simply acting as an additional layer between the business unit CEO and the Group Chairperson.'),\n      pt('2. Establish my role in smoothing communication:', 'I would help the business unit CEO understand how I can smooth communication between them and the Group Chairperson, particularly where they need additional support or where their viewpoint has not been adequately conveyed to the Chairperson. This would help build credibility and rapport quickly.'),\n      pt('3. Identify challenges and demonstrate value through resolution:', 'I would try to understand the challenges or blockers the business unit CEOs are facing in their live projects. If I could demonstrate that I can contribute to resolving these challenges, it would help establish my credibility quickly.')\n    ]},\n    { title: 'A business unit CEO openly challenges your competence in a meeting with other senior leaders. How would you respond in the moment and handle the situation afterward?', blocks: [\n      p('This may require a slightly tough conversation. A rebuttal may be necessary because the undermining of my role is visible to other business heads as well. If I, or anyone in this role, loses credibility or is seen as being undermined, others may lose confidence in the role too. It could create the impression that I am not significant enough to add value as an intermediary between the Chairperson and the business unit leaders.'),\n      li('Stay calm, but address the issue explicitly:', 'I would explain that the lack of cooperation, timely inputs, and sharing of metrics for tracking is hurting my role and affecting the Chairperson\\'s visibility.'),\n      li('Clarify that my role is not to undermine the business unit CEO\\'s judgment:', 'I would explain in the same conversation that a person in my role is not there to undermine their judgment; they have the best pulse of the issue.'),\n      li('Reinforce the support and coordination I can provide:', 'I would clarify that my role is to understand whether they need support, identify blockers we can help resolve, and find areas where coordination with other business units could help.'),\n      li('Offer an outside perspective and gather strategic insights:', 'In some cases, I may bring in an outside perspective for them to explore. I would also gather sufficient insights from them to shape the Group\\'s long-term strategic moves.')\n    ]},\n    { title: 'You need to deliver an unpopular message on behalf of the Chairperson, but you know the business unit CEO will disagree with it. How would you communicate the message while preserving the relationship?', blocks: [\n      p('The disagreement could arise for multiple reasons:'),\n      pt('1. Insufficient discussion of granular aspects:', 'The issue may not have received the brainstorming and detailed discussion it required.'),\n      pt('2. Incomplete representation of the business unit\\'s viewpoint:', 'All the business unit\\'s viewpoints may not have been communicated to the Chairperson, or they may have been inadequately advised or presented.'),\n      pt('3. Differences in judgment:', 'The parties may have different viewpoints on the issue, even after considering its various aspects.'),\n      p('Ultimately, it comes down to a judgment call, and both parties may have their own perspectives. The final prerogative to make the decision always rests with the Chairperson.'),\n      p('The issue arises when the business unit feels that its viewpoint has not reached the Chairperson or that the granular aspects of the issue have not received the necessary attention.')\n    ]},\n    { title: 'How would you distinguish between a business unit CEO who genuinely needs your support and one who is deliberately avoiding accountability? What would you do differently in each case?', blocks: [\n      p('My first step would be to diagnose which category the case falls into. The only way to establish this is through more pinpointed conversations, asking questions to understand the specifics.'),\n      pt('1.', 'The issue would fall under the category that the business unit CEO genuinely needs support, if through the conversation, it may emerge that:'),\n      li('', 'The business unit is facing a lack of clarity on what its roadmap of action should be.'),\n      li('', 'The business unit is facing blockers or resource constraints for which it needs support.'),\n      li('', 'By dissecting the issue, the business unit has reached a point that requires a judgment call, for which it needs further assistance and advice.'),\n      pt('2.', 'The issue would fall under the category that there is resistance to taking accountability: if, despite repeated probing, above specifics do not emerge. At a broader level, this signals that the business unit is facing a challenge that may reflect resistance to taking accountability for bold, significant moves.'),\n      h('Adapt the approach based on the diagnosis:'),\n      li('', 'If the business unit CEO genuinely needs support, the channel of communication will be clear, and the discussion will address the specific issue they have raised.'),\n      li('', 'If the business unit CEO is avoiding accountability, we need to push further to bring out the specifics and encourage more internal brainstorming to identify concrete points for discussion. Only when these granular inputs are collected and presented can we offer significant help to the business unit.')\n    ]}\n  ]},\n\n  { name: 'Execution: Monitoring, and Risk Management',\n    tagline: 'Monitoring initiatives, driving action and managing slippages; unexpected failures, early warning signals and corrective action',\n    about: 'This covers projects that suddenly fail despite positive updates, risks that were missed, incomplete information, and situations where the Chairperson needs a rapid assessment and recovery plan.',\n    challenges: ['Status reports that say green while the work says otherwise', 'Milestones that slip again and again', 'More initiatives than the organization has bandwidth for'],\n    core: 'How do you identify problems early, respond when things go wrong, and maintain credibility when outcomes are uncertain?',\n    qs: [\n    { title: 'The Chairperson asks you to drive a strategic initiative involving multiple business units. How would you translate the broad objective into workstreams, milestones, owners and measurable outcomes?', blocks: [\n      p('My first objective would be to get the business unit leaders on the same page and bring out their ideas, opinions, and hypotheses on the issue.'),\n      li('Collect the individual viewpoints:', 'I would have forms or documents filled out by the individual business unit leaders and collect the information from each of them. All the leaders would be asked to fill the form separately. More often than not, this check itself will help you identify the divergent understanding of some foundational aspects.'),\n      li('Anchor discussions around differences:', 'Based on the information collected, I would identify differences in their standard notions and anchor discussions accordingly. Through these discussions, I would drill down into the granular aspects where there is a difference of opinion and understand why.'),\n      li('Find common ground and document remaining differences:', 'I would put significant effort into finding a middle ground or common ground. After thorough brainstorming, any differences that persist would be documented, along with why different leaders are suggesting a particular approach and the hypotheses behind their views. This would also serve as a reference for future conversations and meetings.'),\n      li('Use follow-up meetings to diagnose what is holding things up:', 'In follow-up meetings, I would drill down into the differences, challenges, and reasons something is getting stuck. These could be blockers such as administrative processes, bureaucratic hurdles, or operational resource constraints, which are more facilitation-related issues. Alternatively, something could be stuck because of a clear difference in judgment on particular aspects. All these elements need to be brought out explicitly.')\n    ]},\n    { title: 'A business unit CEO commits to completing an important milestone by a particular date but repeatedly misses deadlines. How would you handle the situation?', blocks: [\n      p('My course of action would be to have a thorough conversation and communicate to understand the reasons for missing deadlines. The issue could fall into one of three categories:'),\n      li('', 'Very strict, ambitious deadlines were set at the beginning, and they are becoming difficult to manage.'),\n      li('', 'Unforeseen blockers have emerged that no one could have anticipated.'),\n      li('', 'Operational inefficiency is hurting the plan’s progress.'),\n      h('The support actions would depend on which category the issue falls into:'),\n      li('If the deadlines were too strict or ambitious:', 'Discuss whether the deadlines need to be recalibrated to make them more realistic.'),\n      li('If there are unforeseen blockers:', 'Discuss what support is needed from the Group Chairperson to mitigate the impact.'),\n      li('If the issue is operational inefficiency:', 'Push for internal realignment and restructuring, and offer or encourage the adoption of best practices from other business units.'),\n      p('Overall, I would sensitize the business unit leadership to the fact that repeatedly missing deadlines puts the reputation of both the leader and the business unit in a bad light. Repeated delays are very difficult for the Chairperson to communicate when speaking to the board or other stakeholders and can sometimes become a major embarrassment for them.')\n    ]},\n    { title: 'You are preparing a weekly update for the Chairperson. Several initiatives are marked green by their respective teams, but you suspect that the underlying progress does not support those assessments. What would you do?', blocks: [\n      p('Before escalating the issue or presenting my view to the Chairperson, I would conduct a thorough assessment.'),\n      li('Probe further:', 'Ask more questions to understand the underlying progress of the initiatives.'),\n      li('Follow up with the relevant teams:', 'Engage with the business unit and reporting teams to get a better understanding of the situation.'),\n      li('Collate alternate metrics:', 'Gather additional metrics that would either validate my assumptions or nullify them.'),\n      li('Present an evidence-based assessment:', 'Only after this thorough assessment would I present my view to the Chairperson. I would also communicate my level of confidence in the assessment and highlight specific points that I believe warrant a second look.')\n    ]},\n    { title: 'The Chairperson has launched five strategic initiatives, but the organization has limited bandwidth and progress is slow across all five. How would you decide what to prioritize?', blocks: [\n      p('Five strategic initiatives have been identified. Since these are already strategic initiatives, the business case and business utility for each would have been assessed. All five are equally important for us to undertake now.'),\n      li('Undertake comprehensive tracking of all five initiatives:', 'Monitor granular aspects of each initiative, including blockers, risks, and the support needed for smooth progress.'),\n      li('Make every effort to deliver the initiatives:', 'Because these initiatives have already gone through layers of due diligence and filters, we must strive to get them done, even if this requires us to move out of our comfort zone.'),\n      li('Reprioritize if the initiatives remain unmanageable:', 'If, after some time, it becomes clear that the initiatives cannot be managed even with additional resource assistance, I would undertake a fresh prioritization based on a matrix of factors.'),\n      p('These factors could include: Business potential of the initiative, Network effect of the business initiative, Time-decay value of the initiative: whether it can be put on hold and undertaken or restarted in the near future, or other parameters, as the case may warrant.'),\n      li('Learn from the experience:', 'Take lessons for the future about the strategic bandwidth capacity of the Group or individual business units to undertake multiple initiatives simultaneously.')\n    ]},\n    { title: 'An initiative requires contributions from the sales, technology and operations teams of three different companies. Each team has its own priorities, timelines and leadership. How would you coordinate execution?', blocks: [\n      h('1. Align everyone on one shared outcome'),\n      p('Clearly define the group-level objective, success metrics, and value to each subsidiary.'),\n      li('', 'Ask each team to fill out a form independently at the outset, capturing its understanding of the objective, scope, priorities, and expected outcomes.'),\n      li('', 'Compare responses to identify and resolve misalignment before execution begins.'),\n      pr('Principle:', 'Establish a common understanding before starting execution.'),\n      h('2. Establish clear ownership and accountability'),\n      p('In projects within one team, some ambiguity around responsibilities may be tolerable and resolved as work progresses. Across multiple teams or subsidiaries, clear ownership and boundaries are far more important.'),\n      li('', 'Assign an overall project owner and named workstream owners.'),\n      li('', 'Define deliverables, deadlines, dependencies, and decision-making authority.'),\n      li('', 'Explicitly identify areas where responsibilities overlap or boundaries are unclear.'),\n      pr('Principle:', 'Collective responsibility must not dilute individual accountability.'),\n      h('3. Map dependencies, not just individual timelines'),\n      p('Understand how each team\\'s deliverables affect the others and the overall project timeline.'),\n      li('', 'Identify critical dependencies, bottlenecks, and milestones.'),\n      li('', 'Work backwards from the final deadline.'),\n      li('', 'Flag delays early and establish contingency plans.'),\n      pr('Principle:', 'Manage the interfaces between teams, not just the teams themselves.'),\n      h('4. Reconcile priorities and capacity upfront'),\n      p('Teams may lose enthusiasm when involvement in a group initiative comes at the expense of their existing projects.'),\n      li('', 'Understand competing priorities, workloads, and resource constraints.'),\n      li('', 'Create a forum for stakeholders to raise concerns openly.'),\n      li('', 'Resolve trade-offs through reprioritization, resource allocation, or revised timelines.'),\n      pr('Principle:', 'Treat priority conflicts as resource-allocation decisions, not merely follow-up problems.'),\n      h('5. Create a well-structured, defined cadence structure'),\n      p('Establish a regular forum with relevant senior stakeholders to keep the initiative on track.'),\n      li('', 'Review outcomes, milestones, dependencies, and risks using a consistent format.'),\n      li('', 'Discuss blockers, support required, and cross-team disagreements.'),\n      li('', 'Agree on actions, owners, and deadlines.'),\n      li('', 'Escalate unresolved issues to the appropriate leadership level, including the Group Chairperson when necessary.'),\n      pr('Principle:', 'Make reviews decision-oriented, ensuring risks are addressed early and the required support is secured.')\n    ]}\n  ]},\n\n  { name: 'Cross-Business Coordination and Conflict Resolution',\n    tagline: 'Aligning different business unit CEOs, functions and business priorities',\n    about: 'This covers situations where business units have competing objectives, dependencies, conflicting priorities or disagreements over resources and ownership.',\n    challenges: ['Business units with competing objectives and timelines', 'Costs landing on one unit while the benefits go to another', 'Resistance to common, Group-wide processes'],\n    core: 'How do you get multiple business leaders to work toward a common outcome when their individual priorities differ?',\n    qs: [\n    { title: 'The Chairperson wants the Group to introduce a common process across all companies, but the business unit CEOs argue that their businesses have different operating requirements. How would you determine what should be standardized and what should remain local?', blocks: [\n      p('My objective would be to have an in-depth discussion on why standardization makes or does not make sense.'),\n      pt('1. Understand the reasons for resistance:', 'If business unit leaders argue against standardization, I would have focused conversations to bring out the reasons behind their position.'),\n      pt('2. Distinguish evidence-based concerns from bias:', 'I would determine whether their concerns are based on focused, data- and insight-driven analysis showing that standardization would negatively affect them, or whether the resistance stems from bias or risk aversion toward trying something new.'),\n      pt('3. Push for thorough brainstorming:', 'I would push back against resistance to brainstorming and encourage a detailed discussion of the underlying arguments. This would help ensure that the discussion proceeds in the right direction.')\n    ]},\n    { title: 'A cross-business initiative creates significant value for the Group overall, but most of the cost and effort fall on one business unit while the benefits accrue to another. How would you resolve the misalignment?', blocks: [\n      pt('1. Understand why the cost-benefit sharing is being challenged:', 'When the business case for an initiative is created, a thorough assessment of the costs and benefits expected to accrue should already have been undertaken. If a business unit later argues that costs and benefits are not being shared proportionately, my first objective would be to understand why this concern has arisen.'),\n      pt('2. Identify whether unforeseen circumstances have changed the economics:', 'Unforeseen developments may have escalated costs or reduced the benefits for a particular business unit. In such a case, the appropriate response would be to recalibrate the sharing of costs and benefits.'),\n      pt('3. Check whether an expense was missed in the original business case:', 'If an expense was genuinely overlooked during the initial assessment, this would also warrant a recalibration of the cost and benefit sharing.'),\n      pt('4. Distinguish inefficiencies from a genuine change in the business case:', 'A new process or initiative may introduce inefficiencies that increase costs or reduce the benefits realized by one business unit. This requires a different response: inefficiencies in one part of the organization should not penalize another unit that is performing well. The Group or the Chairperson’s team could offer support to restore performance and identify best practices from other business units.'),\n      pr('Drill down to the underlying cause:', 'The overall objective is to establish why the actual costs and benefits differ from what was assessed when the business case was developed, and then choose the response based on the cause identified.')\n    ]},\n    { title: 'One business unit refuses to share data or resources with another because it believes doing so would weaken its competitive advantage within the Group. How would you handle this?', blocks: [\n      p('I would not immediately treat the refusal as a lack of cooperation. I would first understand what the subsidiary is protecting, why it believes sharing the data creates a disadvantage, and whether that concern is legitimate or a symptom of a broader trust or governance issue.'),\n      h('What could be causing the refusal?'),\n      h('1. Concerns about competitive sensitivity, data usage, and leakage'),\n      p('The subsidiary may fear that sharing commercially sensitive information, such as pricing, margins, customer data, sales pipelines, or product plans, could weaken its competitive position. If the data enters a common group pool, there may also be a risk of accidental leakage beyond the group, potentially compromising the subsidiary\\'s competitive advantage in the external market.'),\n      pt('How to resolve it:', 'Clarify the purpose of the request and limit data sharing to what is necessary to extract best practices and learnings for the wider group. Establish clear access controls, confidentiality safeguards, and rules governing how the information can be used. Where possible, use aggregated or anonymized data.'),\n      h('2. Competition between subsidiaries within the group'),\n      p('Although the companies belong to the same group, they may compete for customers, capital, leadership attention, resources, or strategic opportunities. A subsidiary may fear that sharing information will give another subsidiary an advantage.'),\n      pt('How to resolve it:', 'Establish clear rules on what information can be shared, with whom, and for what purpose. Emphasize that the objective is to identify best practices and enable group-wide learning, not to unnecessarily disadvantage the contributing subsidiary.'),\n      h('3. Misaligned incentives between group and subsidiary leadership'),\n      p('The group may benefit from sharing data, while the subsidiary CEO is assessed primarily on the subsidiary\\'s performance. If sharing creates a perceived disadvantage without a corresponding benefit, the business unit CEO may have little incentive to cooperate.'),\n      pt('How to resolve it:', 'Make the business case explicit by showing how sharing can improve decisions, identify synergies, reduce costs, or increase revenue. Where relevant, align performance metrics with group-wide outcomes rather than focusing exclusively on individual subsidiary results.'),\n      h('4. Concerns about personal risk for subsidiary leadership'),\n      p('Beyond commercial considerations, subsidiary leadership may personally feel at risk. They may worry that sharing data will expose shortcomings, invite greater scrutiny, or allow other leaders to take credit for their team\\'s work. Although this is a personal concern, the human factor is important and should not be overlooked.'),\n      pt('How to resolve it:', 'Provide clear assurance that sharing data for group-wide learning will not put the subsidiary leadership at a disadvantage. In fact, identifying and sharing successful practices can demonstrate the subsidiary\\'s capabilities, highlight its contribution to the group, and strengthen its leadership\\'s standing and future prospects.'),\n      h('5. Concerns about autonomy and perceived interference'),\n      p('The refusal may reflect a concern that the Group Chairperson\\'s office is becoming too involved in the subsidiary\\'s operations. Data requests may be perceived as an attempt to monitor or control the business rather than enable collaboration.'),\n      pt('How to resolve it:', 'Clarify the group\\'s legitimate need for visibility and distinguish it from interference in day-to-day decisions. Explain how the information will support better decision-making and coordination while respecting the subsidiary\\'s operating autonomy.')\n    ]}\n  ]},\n\n  { name: 'Group-Wide Strategic Initiatives',\n    tagline: 'Strategic thinking and business judgment: prioritization, strategic initiatives and decision support',\n    about: 'This covers helping the Chairperson determine where to focus, evaluating competing initiatives, identifying business risks and opportunities, and translating broad strategic direction into concrete choices.',\n    challenges: ['Competing priorities and very limited Chairperson time', 'Judging new opportunities on incomplete information', 'Knowing what to escalate, delegate or resolve yourself'],\n    core: 'How do you help the Chairperson make the right decisions across businesses?',\n    qs: [\n    { title: 'The Chairperson asks you to evaluate a new strategic opportunity for the Group. How would you assess whether it is worth pursuing and develop a recommendation?', blocks: [\n      pt('1. Conduct comprehensive secondary research:', 'Begin evaluating a new strategic opportunity with detailed secondary research to understand the opportunity, the industry, and the key issues involved.'),\n      pt('2. Use agentic research workflows:', 'Leverage well-designed agentic research workflows to conduct comprehensive research. Include checks for hallucinations or fabricated information, validating findings against the preliminary secondary research.'),\n      pt('3. Identify specific areas requiring deeper investigation:', 'Use the initial research to drill down into specific questions or issues where more information, expert opinion, or a different perspective is required.'),\n      pt('4. Leverage the Group’s network to consult experts:', 'Use the Group’s extensive network to identify and speak with relevant experts. Seek their views on specific issues, particularly those where industry opinion and practical perspectives would add value.'),\n      pt('5. Consolidate the findings into a report:', 'Combine the secondary research, validation checks, and expert perspectives into a consolidated report for presentation.'),\n      pr('Overall approach:', 'Use agentic research workflows to build a comprehensive preliminary understanding, then supplement that research with targeted expert conversations before consolidating the findings for decision-making.')\n    ]},\n    { title: 'The Chairperson has several competing priorities and limited time. How would you determine which issues require their direct attention, which can be delegated to the business unit CEOs, and which you can resolve yourself?', blocks: [\n      pt('Define the decision-making boundaries:', 'This segregation is a core objective of the role. Determine which issues require the direct attention of the Group Chairperson or Group CEO, which can be resolved by the Chief of Staff, and which should be delegated to discretion of business unit CEOs.'),\n      h('My core objectives:'),\n      pt('1. Free up the Group CEO’s time and strategic bandwidth:', 'Enable the Group CEO to focus on matters that require their direct attention, allowing them to make more informed and thoroughly considered decisions.'),\n      pt('2. Assurance that decisions are handled in the best possible way:', 'Although saving time and bandwidth is a priority, the Group CEO must remain assured that matters resolved before reaching them have been handled appropriately and that decisions have been made with due consideration.'),\n      pt('3. Build confidence in the delegation hierarchy:', 'The way decisions are filtered, delegated and resolved must build trust among senior stakeholders. They should have confidence that decisions are being handled at the appropriate level and that the delegation framework is reliable.'),\n      pt('Widen decision-making autonomy gradually:', 'I would follow the approach that initially, take a cautious approach and keep the Group Chairperson or Group CEO informed about most decisions. As experience, credibility and expertise increase, gradually expand the scope of decisions that can be resolved independently, thereby releasing more strategic bandwidth for the Group CEO.'),\n      h('My framework for filtering the decision-making domain:'),\n      li('Decisions requiring direct Group CEO attention:', 'These would include matters requiring significant cross-functional collaboration, major crisis management, or decisions with a long-term impact on Group performance or the Group’s strategic direction.'),\n      li('Business-specific decisions to business unit CEOs:', 'Most decisions relating to a business unit should remain with its CEO when they can be supported by data and insights. The business unit CEO is generally best positioned to make decisions concerning their own business.'),\n      li('Resolve recurring or precedent-based matters independently:', 'The Chief of Staff can step in when similar scenarios have occurred before or when established precedents provide a basis for resolving the issue. As experience and credibility grow, this scope can be widened progressively.'),\n      pr('Overall principle:', 'The objective is to establish a trusted decision-making hierarchy that protects the Group CEO’s strategic bandwidth without compromising decision quality, accountability or the confidence of senior stakeholders.')\n    ]}\n  ]},\n\n  { name: 'Difficult Conversations, Integrity, and Judgment',\n    tagline: 'Bad news, uncomfortable truths, confidentiality and tough calls',\n    about: 'This covers reporting negative developments, challenging optimistic narratives, delivering bad news to the Chairperson, handling politically sensitive situations and deciding when to escalate.',\n    challenges: ['Bad news that contradicts earlier, optimistic updates', 'Candid views that could affect someone’s position', 'Mistakes being concealed, and deciding when to escalate'],\n    core: 'Can the Chairperson trust you to communicate the truth, especially when the truth is uncomfortable?',\n    qs: [\n    { title: 'You discover that a major project is in serious trouble, despite having previously reported that it was progressing well. How would you communicate this to the Chairperson, particularly if your earlier updates were overly optimistic?', blocks: [\n      pt('Scenario:', 'In multiple past reports, the project was shown as green, but suddenly the project looks like it is in serious trouble or has collapsed.'),\n      pt('1. Diagnose why the project’s reported status differed from its eventual outcome:', 'If a project has repeatedly been reported as green but suddenly appears to be in serious trouble or collapses, my first reaction would be to understand why the regular project updates did not reflect the underlying reality.'),\n      h('It could be any of the below reasons:'),\n      li('Determine whether incorrect data was communicated:', 'Investigate why the reported data was wrong. Possible causes include a technical issue that caused incorrect data to be synced, the latest data not being synced or reflected in the report, or a more fundamental problem with data collection. The follow-up action should depend on the root cause of the data discrepancy.'),\n      li('Assess whether the right intermediate metrics were tracked:', 'The data may have been accurate, but the project team might not have tracked the intermediate metrics that would have provided an early indication of the project’s deteriorating health. If an important metric was obvious and should clearly have been tracked, this points to poor or incompetent execution. If the metric was not obvious beforehand but would have been a valuable and insightful addition, this should be treated as a significant learning for future projects.'),\n      li('Distinguish avoidable failures from genuinely unforeseen events:', 'A project may also have been affected by an unforeseen event, such as COVID, that could not reasonably have been anticipated or for which additional preventive measures would not have been practical.'),\n      pr('Tailor the follow-up action to the root cause:', 'The response should depend on which category the situation falls into: incorrect data, inadequate intermediate metrics, or a genuinely unforeseen event. This distinction is important to ensure that the follow-up addresses the actual cause rather than treating every project failure in the same way.')\n    ]},\n    { title: 'The Chairperson asks for your candid assessment of a business unit CEO\\'s performance, knowing that your feedback could have serious implications for that person\\'s position. How would you approach the conversation?', blocks: [\n      li('Build credibility by being honest about the limits of my knowledge:', 'In this role, I want to establish high credibility for my opinions. Whenever I am unsure or do not have full conviction, I should not hesitate to say that I am not aware of the issue, even if that makes me appear less knowledgeable in the moment.'),\n      li('Provide a detailed and granular assessment of a business unit CEO’s performance:', 'When asked to assess a business unit CEO’s performance on a critical issue, I would provide a detailed breakdown of the different elements that I have sufficient knowledge of, rather than offering a broad or superficial opinion.'),\n      li('Ground feedback in the business unit CEO’s past record:', 'Before providing feedback, I would gather relevant details about the business unit CEO’s past performance and track record to ensure that the assessment is based on sufficient context.'),\n      li('Avoid casual remarks and offer an opinion only after a comprehensive assessment:', 'I would not make casual or off-the-cuff remarks on critical matters. I would share my view only after conducting a thorough assessment and reaching a position I can express with conviction.'),\n      pr('Overall principle:', 'Credibility comes not from having an immediate answer to every question, but from being honest about what I know and ensuring that any opinion I do offer is well-founded and carefully considered.')\n    ]},\n    { title: 'The Chairperson asks you to communicate a decision that you personally disagree with. How would you represent the decision to the organization while maintaining your own professional integrity?', blocks: [\n      li('Accept that the final decision rests with the Group CEO or Chairperson:', 'I have faced this issue multiple times in my previous startup, where I had severe disagreements with my CEO. My view is that the final decision is the prerogative of the Group CEO or Chairperson. The stakes for that individual are much higher, and once a decision is taken after due consideration, I should accept their judgment with conviction, even if I personally disagree with it.'),\n      li('Recognize that decisions are not always entirely right or wrong:', 'For most decisions, the outcome is not a simple case of something being fully right or fully wrong. How an action is followed through can determine its eventual consequences. Therefore, the objective should not be to eliminate every difference of opinion, but to ensure that the decision-making process is thorough.'),\n      li('Ensure that disagreements receive due consideration:', 'Before a final decision is taken, the disagreement should be thoroughly discussed and brainstormed. My concern is that the differing viewpoint should receive adequate attention rather than being dismissed prematurely.'),\n      li('Explicitly surface areas where judgment differs:', 'The specific aspects on which the stakeholders have different judgments should be clearly identified and brought out for discussion. This helps ensure that the decision-maker understands the nature of the disagreement.'),\n      li('Document the assumptions and hypotheses underlying the decision:', 'Whatever decision is taken, the assumptions or hypotheses supporting it should be recorded. This documentation becomes a reference point for evaluating the decision in the future.'),\n      li('Use documented assumptions to evaluate outcomes objectively:', 'Without recording the underlying assumptions, there is no clear baseline against which to assess the decision later. Documenting them helps distinguish whether the outcome resulted from the original judgment, the assumptions proving incorrect, or how the action was subsequently executed.'),\n      pr('Overall principle:', 'My objective is to ensure that every significant disagreement is preceded by thorough discussion and brainstorming, that differences in judgment are explicitly surfaced, and that the final decision and its underlying assumptions are documented. Once the decision is made, it should be accepted and pursued with conviction.')\n    ]},\n    { title: 'You discover that a senior executive has made a serious mistake and is attempting to conceal it. How would you establish the facts, decide whom to inform and handle the situation?', blocks: [\n      pt('1. Understand the nature of the mistake and the attempted concealment:', 'If I discover that a senior executive has made a serious mistake and is attempting to conceal it, my first step would be to investigate the issue in depth and understand what has happened.'),\n      pt('2. Distinguish unethical conduct from a business judgment error:', 'If the issue involves an unethical practice, it warrants serious escalation. I would immediately report it to the Group Chairperson and work towards resolving it. If the mistake arose from a business judgment call that now appears to have been wrong, I would assess its potential impact before deciding on the next course of action.'),\n      pt('3. Assess the potential impact of the mistake:', 'The severity and potential consequences of the mistake would determine whether there is room to work with the senior executive on corrective action or whether immediate escalation is necessary.'),\n      pt('4. If the impact is low, give the executive an opportunity to correct the mistake:', 'Work with the executive to identify and implement corrective action, demonstrate confidence in their ability to resolve the issue, and follow up after a short interval. I would then communicate the matter to the Chairperson in a way that reflects confidence in the executive’s ability to fix it.'),\n      pt('5. If the potential impact is very high, escalate immediately:', 'In such a case, I would have no choice but to escalate the issue to the Group CEO or Chairperson without delay.'),\n      pt('6. Bring the executive into the resolution process:', 'Even when immediate escalation is necessary, I would take the executive into confidence and communicate that, although the mistake is serious, the damage may still be mitigated. I would encourage them to bring their expertise and experience to the table and work in tandem with the Group Chairperson or CEO to resolve the issue.'),\n      pr('Overall principle:', 'First establish whether the issue involves unethical conduct or a business judgment error, then assess its potential impact. The response should be proportionate to the nature and severity of the issue, while creating an opportunity for corrective action wherever appropriate.')\n    ]}\n  ]},\n\n  { name: 'Executive Representation and Diplomatic Engagement',\n    tagline: 'Acting as the Chairperson’s proxy in high-stakes meetings and stakeholder engagements',\n    about: 'This covers acting as the Chairperson’s proxy in board meetings, with senior internal and external stakeholders, in government and regulatory engagements, and with international partners: representing their interests, communicating their position, handling sensitive discussions and exercising sound judgment within delegated authority.',\n    challenges: ['Speaking for the Chairperson without exceeding your authority', 'Sensitive questions you have no explicit brief for', 'Being so cautious that the meeting loses its value'],\n    core: 'How do you effectively act as the Chairperson’s proxy, represent their interests and make sound decisions in high-stakes engagements without exceeding your authority?',\n    qs: [\n    { title: 'The Chairperson asks you to represent them in a meeting with the business unit CEOs of several companies. How would you prepare, conduct the meeting and communicate the outcomes?', blocks: [\n      pt('1. Represent the Group CEO effectively in their absence:', 'When acting as a proxy for the Group CEO or Chairperson, my objective is to fill in for their absence, communicate their decisions and concerns, and collate the concerns that other stakeholders wish to convey to them.'),\n      pt('2. Protect the credibility of the Chairperson:', 'Ensuring the Chairperson’s credibility is the topmost priority. I must not make casual remarks or communicate positions on their behalf without adequate understanding and preparation.'),\n      pt('3. Avoid being so cautious that the meetings lose their value:', 'At the same time, I cannot play it safe or dodge every question by saying that I do not have the authority to comment. If I repeatedly do this, stakeholders may stop taking such meetings seriously when the Chairperson or Group CEO is absent. It would also fail to respect the time invested by other senior stakeholders.'),\n      pt('4. Prepare comprehensively before the meeting:', 'To make the meeting meaningful, I would need to understand the Group CEO’s thinking in detail, including:'),\n      li('', 'The decisions and concerns they want communicated to the wider audience.'),\n      li('', 'The questions they anticipate or want addressed.'),\n      li('', 'How firmly or sternly different concerns should be communicated.'),\n      li('', 'The questions other stakeholders might raise, so these can be discussed with the Group CEO in advance.'),\n      li('', 'Clear boundaries on what I can and cannot decide independently, including areas where I can exercise my own judgment.'),\n      pt('5. Agree on decision boundaries in advance:', 'Establish clear go/no-go parameters with the Group CEO, identifying which matters require their explicit direction and which allow me to make a judgment call during the meeting. This will help me respond meaningfully without compromising the Chairperson’s position.'),\n      pt('Expand autonomy as credibility and expertise grow:', 'As my experience, credibility and expertise in the role increase, I can progressively seek greater autonomy to make smaller, more operational decisions independently.'),\n      pr('Overall principle:', 'The objective is to represent the Group CEO faithfully while ensuring that meetings remain substantive and valuable. This requires comprehensive preparation, clear decision boundaries and gradually increasing autonomy as trust develops.')\n    ]},\n    { title: 'During a board meeting, a director asks for your opinion on a sensitive strategic issue, but you do not have explicit instructions from the Chairperson. How would you respond?', blocks: [\n      h('These are my objectives to fulfill from the beginning:'),\n      pt('1. Protect the credibility of the Chairperson:', 'Ensuring the Chairperson’s credibility is the topmost priority. I must not make casual remarks or communicate positions on their behalf without adequate understanding and preparation.'),\n      pt('2. Avoid being so cautious that the meetings lose their value:', 'At the same time, I cannot play it safe or dodge every question by saying that I do not have the authority to comment. If I repeatedly do this, stakeholders may stop taking such meetings seriously when the Chairperson or Group CEO is absent. It would also fail to respect the time invested by other senior stakeholders.'),\n      h('My approach:'),\n      li('Break the issue into smaller components.', 'Rather than giving an outright yes or no, I would divide the issue into multiple substreams. Where I understood the Chairperson’s position, I could express an informed view.'),\n      li('Identify the information needed for unresolved decisions.', 'For the parts where I could not give a definitive view, I would explain what additional information the Chairperson or Group CEO would need to make the decision, and use the meeting to gather that information.'),\n      li('Close part of the decision loop before returning to the Group CEO.', 'This approach would allow some aspects of the issue to be addressed during the meeting, reducing the number of unresolved questions. I would then return to the Group CEO with the relevant data needed to make the remaining decisions.'),\n      pr('Overall principle:', 'Do not compromise the Chairperson’s credibility, but do not let excess caution make the meeting unproductive or lose its significance. Resolve what can be resolved, identify what remains uncertain, and return with the information required to make the decision.')\n    ]}\n  ]}\n];\nvar CHIPS = [\n  { label: 'Building credibility and influence with senior business unit CEOs', b: 0, q: 0 },\n  { label: 'Resolving misalignment between cross-business costs and benefits', b: 2, q: 1 },\n  { label: 'Handling a subsidiary’s refusal to share data or resources', b: 2, q: 2 },\n  { label: 'Prioritizing the Chairperson’s attention and delegating decisions', b: 3, q: 1 },\n  { label: 'Reporting a failing project after overly optimistic updates', b: 4, q: 0 },\n  { label: 'Responding to sensitive strategic questions without the Chairperson’s guidance', b: 5, q: 1 }\n];\nvar STOP = { the: 1, and: 1, for: 1, with: 1, that: 1, this: 1, have: 1, they: 1, their: 1, from: 1, what: 1, when: 1, how: 1, are: 1, but: 1, not: 1, you: 1, your: 1, who: 1, keeps: 1, would: 1 };\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { bucket: -1, open: -1, query: '', results: null, bfs: 20, bwrap: false };\n  }\n  componentDidMount() {\n    var self = this;\n    this._fit = function () { self.fitBuckets(); };\n    window.addEventListener('resize', this._fit);\n    setTimeout(this._fit, 60);\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this._fit);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._fit); }\n  componentDidUpdate(pp, ps) { if (ps.bucket !== -1 && this.state.bucket === -1) setTimeout(this._fit, 30); }\n  fitBuckets() {\n    var btns = document.querySelectorAll('.buckets--grid .bucket');\n    if (!btns.length) return;\n    if (window.innerWidth <= 720) { if (this.state.bfs !== 18 || !this.state.bwrap) this.setState({ bfs: 18, bwrap: true }); return; }\n    var ctx = (this._cv || (this._cv = document.createElement('canvas'))).getContext('2d');\n    var family = getComputedStyle(btns[0]).fontFamily;\n    var best = 0;\n    for (var size = 22; size >= 15; size--) {\n      ctx.font = '700 ' + size + 'px ' + family;\n      var ok = true;\n      for (var i = 0; i < btns.length; i++) {\n        var cs = getComputedStyle(btns[i]);\n        var avail = btns[i].clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;\n        if (ctx.measureText(btns[i].textContent.trim()).width > avail) { ok = false; break; }\n      }\n      if (ok) { best = size; break; }\n    }\n    var next = best ? { bfs: best, bwrap: false } : { bfs: 15, bwrap: true };\n    if (next.bfs !== this.state.bfs || next.bwrap !== this.state.bwrap) this.setState(next);\n  }\n  toBrowse() {\n    setTimeout(function () {\n      var el = document.getElementById('browse');\n      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    }, 40);\n  }\n  go(b, q) {\n    this.setState({ bucket: b, open: q }, function () {\n      setTimeout(function () {\n        var el = document.getElementById('qrow-' + q);\n        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      }, 60);\n    });\n  }\n  search(text) {\n    var query = typeof text === 'string' ? text : this.state.query;\n    if (query.trim().length < 3) { this.setState({ results: null }); return; }\n    var words = query.toLowerCase().split(/[^a-z’']+/).filter(function (w) { return w.length > 2 && !STOP[w]; });\n    var hits = [];\n    DATA.forEach(function (bk, bi) {\n      bk.qs.forEach(function (q, qi) {\n        var hay = (q.title + ' ' + q.blocks.map(function (k) { return k.lead + ' ' + k.text; }).join(' ')).toLowerCase();\n        var score = 0;\n        words.forEach(function (w) { if (hay.indexOf(w.slice(0, Math.max(4, w.length - 2))) !== -1) score++; });\n        if (score > 0) hits.push({ b: bi, q: qi, score: score });\n      });\n    });\n    hits.sort(function (a, c) { return c.score - a.score; });\n    this.setState({ results: hits.slice(0, 4) });\n  }\n  renderVals() {\n    var self = this;\n    var s = this.state;\n    var b = s.bucket >= 0 ? DATA[s.bucket] : null;\n    var results = (s.results || []).map(function (hit) {\n      return { bucket: DATA[hit.b].name, title: DATA[hit.b].qs[hit.q].title, go: function () { self.go(hit.b, hit.q); } };\n    });\n    return {\n      buckets: DATA.map(function (x, i) {\n        var cls = 'bucket' + (s.bucket === i ? ' bucket--on' : '') + (s.bwrap ? ' bucket--wrap' : ' bucket--line');\n        return { name: x.name, cls: cls, fs: s.bfs, pressed: s.bucket === i ? 'true' : 'false',\n          pick: function () { self.setState({ bucket: i, open: -1 }, function () { self.toBrowse(); }); } };\n      }),\n      hasBucket: !!b,\n      bucketName: b ? b.name : '',\n      bucketMeta: b ? 'Bucket ' + (s.bucket + 1) + ' of ' + DATA.length : '',\n      noBucket: !b,\n      bfs: s.bfs,\n      bk: b ? { tagline: b.tagline, about: b.about, core: b.core, challenges: b.challenges.map(function (t) { return { text: t }; }) } : { tagline: '', about: '', core: '', challenges: [] },\n      scenarioLabel: 'The scenarios',\n      closeBucket: function () { self.setState({ bucket: -1, open: -1 }, function () { self.toBrowse(); }); },\n      qs: b ? b.qs.map(function (q, i) {\n        return { title: q.title, blocks: q.blocks, num: 'Q' + (i + 1), rowId: 'qrow-' + i,\n          open: s.open === i, closed: s.open !== i, expanded: s.open === i ? 'true' : 'false',\n          toggle: function () { self.setState({ open: s.open === i ? -1 : i }); } };\n      }) : [],\n      chips: CHIPS.map(function (c) { return { label: c.label, go: function () { self.go(c.b, c.q); } }; }),\n      query: s.query,\n      onQuery: function (e) {\n        var v = e.target.value;\n        self.setState({ query: v });\n        clearTimeout(self._t);\n        self._t = setTimeout(function () { self.search(v); }, 200);\n      },\n      onSearch: function (e) { if (e && e.preventDefault) e.preventDefault(); self.search(); },\n      showResults: s.results !== null,\n      resultsLabel: results.length ? 'Closest matches' : 'Nothing close yet. Try other words, or browse above.',\n      results: results\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
